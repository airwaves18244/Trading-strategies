[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt"
version = "0.1.0"
description = "MOEX backtesting terminal for the Trading-strategies research corpus"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "requests>=2.31",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
algopack = ["moexalgo>=2.0"]
dev = ["pytest>=8", "pytest-cov>=4", "httpx>=0.26", "freezegun>=1.4"]

[project.scripts]
qbt = "qbt.cli:app"

[tool.setuptools.packages.find]
include = ["qbt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live network access (deselected by default)",
    "contract: provider-contract tests against recorded or hand-written cassettes",
]
addopts = "-m 'not network'"
